spring:
  application:
    name: fracta
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fracta}
    username: ${DB_USER:fracta}
    password: ${DB_PASSWORD:fracta}
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 Flyway로만 관리
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  batch:
    job:
      enabled: false          # 시작 시 자동 실행 금지 — Phase 9 스케줄러가 JobParameters와 락을 부여
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-components: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  bcrypt-strength: ${BCRYPT_STRENGTH:12}
  jwt:
    # 로컬 개발 기본값. 운영은 JWT_SECRET 환경변수로 주입 (32바이트 이상)
    secret: ${JWT_SECRET:fracta-local-dev-jwt-secret-key-0123456789}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}

issuance:
  subscription-open-scan-delay: 5000   # IS-06 청약 개시 스케줄러 주기(ms)

openapi:
  jwt:
    # 웹앱 JWT와 반드시 다른 값이어야 한다 — 같으면 권한 경계가 무너진다
    secret: ${OPENAPI_JWT_SECRET:fracta-open-api-secret-key-9876543210abcdef}
  webhook:
    timeout-millis: ${OPENAPI_WEBHOOK_TIMEOUT:3000}
    worker-delay-millis: ${OPENAPI_WEBHOOK_WORKER_DELAY:500}

subscription:
  concurrency: ${SUBSCRIPTION_CONCURRENCY:atomic}   # atomic | pessimistic | redis (FSD §8.3)
  redis-lock:
    wait-seconds: 3     # FSD §8.3 tryLock(3, 10, SECONDS)
    lease-seconds: 10

broker:
  env: ${BROKER_ENV:mock}
  # 시세 조회 도메인.
  #
  # 2026-09-03부터 모의 도메인(moapi)이 시세 API를 전면 차단한다 — IGW40023
  # "모의투자에서는 제공하지 않는 API입니다". 8월 31일에는 정상이었다.
  # 실측표: docs/reference/plug-support-matrix.md
  #
  # 그래서 시세는 실전 도메인에서 받는다. 여기서 나가는 건 **조회뿐이다** —
  # 안전은 도메인이 아니라 경로가 보장한다. PlugPathPolicy가 조회 경로만 허용하고,
  # 주문 경로는 소스에 존재하는 것조차 NoBrokerOrderPathTest가 빌드에서 막는다.
  base-url: ${BROKER_BASE_URL:https://api.nhplug.com:8443}
  auth-url: ${BROKER_AUTH_URL:https://api.nhplug.com:8443}
  account-product-code: ${BROKER_ACCOUNT_PRODUCT_CODE:03}
  allow-live: ${BROKER_ALLOW_LIVE:false}
  app-key: ${BROKER_APP_KEY:}
  app-secret: ${BROKER_APP_SECRET:}
  token:
    refresh-margin-seconds: ${BROKER_TOKEN_REFRESH_MARGIN:1800}   # 만료 30분 전 선제 갱신
    cache-prefix: fracta:broker:token
  rate-limit:
    strategy: ${BROKER_RATE_LIMIT_STRATEGY:sliding}   # sliding | bucket
    # 실측값이다. 공식 문서는 "초당 5회 수준", SDK 기본 스로틀은 4이지만
    # 모의 도메인에서 2건/초부터 IGW42903 이 발생했다(1건/초 12/12 성공, 2건/초 10/20).
    # 근거: docs/benchmarks/broker-quota.md
    per-sec: ${BROKER_RATE_LIMIT_PER_SEC:1}
    max-wait-millis: 3000
  # 엔드포인트 경로는 하드코딩하지 않는다 (phase-05 §6-3).
  # 출처: https://www.nhplug.com/openapi-docs/krstock/openapi.json (scripts/plug/spec/)
  endpoints:
    accountInfo: /n2/acctinfo
    currentPrice: /krstock/quote/v1/currentPrice
    currentDaily: /krstock/quote/v1/currentDaily
    period: /krstock/quote/v1/period
  # 모의 도메인 미지원 엔드포인트 → Mock 폴백 (실측으로 채운다)
  unsupported-on-mock: ${BROKER_UNSUPPORTED_ON_MOCK:}
  # 종목마스터. PLUG에 이름 검색 API가 없어 코드↔이름 목록을 로컬에 둔다.
  # 인증 없이 공개 배포된다 — 토큰도 x-client-* 헤더도 필요 없다.
  instruments:
    master-url: ${BROKER_INSTRUMENTS_URL:https://www.nhplug.com/instruments/m_new_stock.mst}
    timeout-millis: ${BROKER_INSTRUMENTS_TIMEOUT:20000}

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
  # AI가 느려도 본 서비스가 같이 느려지면 안 된다. 인덱싱은 이보다 오래 걸릴 수 있어
  # 전용 실행기에서 비동기로 돈다(AiExecutorConfig)
  #
  # 45초인 이유 — 20초로 뒀더니 가드레일 차단 경로가 타임아웃으로 떨어졌다.
  # 차단은 "LLM 호출 → 출력 검사 → 차단"이라 정상 답변보다 오래 걸린다(실측 25.6초).
  # 타임아웃이 짧으면 차단이 AI_UNAVAILABLE로 둔갑해 원인 파악이 어려워진다.
  timeout-millis: ${AI_TIMEOUT_MILLIS:45000}
  circuit-breaker:
    failure-threshold: ${AI_CB_FAILURE_THRESHOLD:3}
    open-millis: ${AI_CB_OPEN_MILLIS:30000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:prospectus}

batch:
  scheduling:
    enabled: ${BATCH_SCHEDULING_ENABLED:true}
  schedule:
    reconciliation: ${BATCH_RECONCILIATION_CRON:0 0 23 * * *}
    chain-verification: ${BATCH_CHAIN_CRON:0 30 23 * * *}
    settlement-report: ${BATCH_SETTLEMENT_CRON:0 0 18 * * *}
    broker-token-refresh: ${BATCH_BROKER_TOKEN_CRON:0 0/30 * * * *}
    allotment-scan-delay: ${BATCH_ALLOTMENT_SCAN_DELAY:60000}
    api-log-archive: ${BATCH_API_ARCHIVE_CRON:0 0 2 * * SUN}
