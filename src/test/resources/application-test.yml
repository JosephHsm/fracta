# 통합 테스트 프로필. datasource/redis/minio 접속 정보는 IntegrationTestBase의 Testcontainers가 주입한다.
spring:
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      # 동시성 계약 테스트가 50 스레드를 띄운다 — 풀이 작으면 락 대기 중 커넥션이 고갈된다.
      maximum-pool-size: 40
      minimum-idle: 2

subscription:
  redis-lock:
    # 50 스레드 직렬화를 견디도록 대기 시간을 늘린다 (운영 기본값은 FSD §8.3의 3초)
    wait-seconds: 30
    lease-seconds: 30

issuance:
  # IS-06 스케줄러는 테스트에서 끈다. 스캔이 전역이라 조건에 맞는 모든 Issuance의 버전을
  # 올리고, 그 행을 쓰던 다른 테스트가 낙관적 락 충돌로 깨진다(전체 스위트에서만 재현됐다).
  # 스캔 로직은 IssuanceLifecycleIntegrationTest가 메서드를 직접 호출해 검증한다.
  subscription-open-scan:
    enabled: false
  subscription-open-scan-delay: 500

security:
  bcrypt-strength: 4   # 테스트 속도 — 다수 계정 생성 시 인코딩 비용 절감

batch:
  scheduling:
    enabled: false   # 통합 테스트 데이터에 스케줄러가 개입하지 않게 JobLauncher로 직접 실행
