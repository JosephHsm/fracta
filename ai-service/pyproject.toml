[project]
name = "fracta-ai"
version = "0.1.0"
description = "FRACTA AI 서비스 — 투자설명서 RAG + 금소법 가드레일 (Phase 8)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "anthropic>=1.0",
    # anthropic 1.x 가 httpx2 기반이다. httpx(1세대) 객체를 섞으면 요청 시점에 거부된다
    "httpx2>=0.28",
    "pdfplumber>=0.11",
    "minio>=7.2",
]

[project.optional-dependencies]
# 임베딩 모델 런타임. torch(~2.5GB) + bge-m3(2.3GB)이므로 기본 설치에서 분리한다.
# CI·단위 테스트는 FakeEmbeddingAdapter로 돌아가므로 이 extra 없이 통과해야 한다.
embeddings = [
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: 실제 bge-m3 + 실제 PostgreSQL 이 있어야 도는 종단 테스트. 없으면 자동 skip",
]
