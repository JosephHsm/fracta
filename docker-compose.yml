services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fracta-postgres
    environment:
      # 슈퍼유저는 컨테이너 관리 전용. 애플리케이션은 init.sql이 만드는
      # 비슈퍼유저 'fracta'로 접속한다 (audit_log 권한 회수가 실효를 갖도록).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fracta
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fracta"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: fracta-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio
    container_name: fracta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  ai-service:
    build: ./ai-service
    container_name: fracta-ai
    environment:
      DB_DSN: postgresql://fracta:fracta@postgres:5432/fracta
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: prospectus
      # 작문 담당. 폐쇄망 전환은 이 한 줄 (claude | ollama)
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      # 검색 담당. AI_PROVIDER 와 무관하게 항상 이 컨테이너 안에서 돈다
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      OPENAPI_SPEC_URL: ${OPENAPI_SPEC_URL:-http://host.docker.internal:8080/v3/api-docs}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/ai/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 폐쇄망 시연용. 기본 기동에서는 제외한다 — 노트북에서 매번 띄울 이유가 없다.
  #   docker compose --profile offline up -d ollama
  #   docker compose --profile offline exec ollama ollama pull qwen3:14b
  ollama:
    image: ollama/ollama
    container_name: fracta-ollama
    profiles: ["offline"]
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  miniodata:
  ollamadata:
